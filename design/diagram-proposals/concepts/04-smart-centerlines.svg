<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="04-smart-centerlines-title 04-smart-centerlines-desc">
<title id="04-smart-centerlines-title">The right operating range depends on the run</title><desc id="04-smart-centerlines-desc">A simplified evolution of the operating-window SVG already present on the current website. Illustrative product and rate contexts have different reviewed ranges, with a transition shown separately and one deviation highlighted for review. There is no claim of guaranteed economic optimality or autonomous process control.</desc>
