<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="565" viewBox="0 0 1000 565" role="img" aria-labelledby="02-platform-title 02-platform-desc">
<title id="02-platform-title">One foundation, three ways to use it</title><desc id="02-platform-desc">An open platform illustration: a reviewed report, an operating-window chart, and a question-and-evidence view sit above shared plant data and process context. Engineering support spans all modules. Existing historians and historian capability where needed are alternative paths, not replacement requirements or product tiers.</desc>
