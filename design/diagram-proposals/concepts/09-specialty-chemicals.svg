<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="09-specialty-chemicals-title 09-specialty-chemicals-desc">
<title id="09-specialty-chemicals-title">Interpret the signal in its operating stage.</title><desc id="09-specialty-chemicals-desc">A jacketed, agitated reactor sits beside qualitative temperature traces aligned to illustrative charge, heat, hold, and cool phases. Three reference runs form a narrow envelope; an amber run differs during the hold stage. The illustration describes a possible comparison, not an Envoy product screen, automatic control, customer data, or a universal chemical process.</desc>
