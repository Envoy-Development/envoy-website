<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="07-pulp-paper-title 07-pulp-paper-desc">
<title id="07-pulp-paper-title">A mill is a connected process.</title><desc id="07-pulp-paper-desc">A connected stock tank, headbox, forming fabric, wet press nips, dryer cylinders, and reel illustrate a paper-machine application. A dashed amber investigation path connects press dewatering with downstream drying demand. This is a conceptual process relationship, not an engineering drawing or customer result.</desc>
