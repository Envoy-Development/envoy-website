<title id="06-industries-title">Different processes. One engineering approach.</title><desc id="06-industries-desc">Three separate equipment scenes represent pulp and paper, food, and specialty chemicals. Dotted data paths join a shared foundation of engineering, analytics, and AI. Pulp and paper is the foundation; food and specialty chemicals are new industry focuses. Equipment is illustrative.</desc>
