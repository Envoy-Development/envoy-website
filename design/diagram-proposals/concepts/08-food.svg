<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="08-food-title 08-food-desc">
<title id="08-food-title">Connect run conditions with production outcomes.</title><desc id="08-food-desc">An illustrative liquid-food line connects a blending vessel to a heat exchanger and filling heads. A buffer vessel branches from the product line. Below, green and amber illustrative traces compare a stable run with a run to investigate under similar product and operating conditions. No customer data, food-safety certification, or product-release claim is shown.</desc>
